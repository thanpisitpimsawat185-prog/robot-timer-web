<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>Robot Timer</title>
  <style>
    :root{color-scheme:dark;--bg:#10131c;--line:#30394c;--text:#f5f7fb;--muted:#9ba6ba;--accent:#c8ff55;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -18%,#293149 0,var(--bg) 55%);color:var(--text)}button,input{font:inherit}button{cursor:pointer}.shell{width:min(900px,calc(100% - 28px));margin:auto;padding:28px 0 40px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.icon{display:grid;place-items:center;width:44px;height:44px;border:1px solid #46513a;border-radius:14px;background:#222b1a;font-size:23px}.title{margin:0;font-size:18px}.subtitle{margin:3px 0 0;color:var(--muted);font-size:13px}.status{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#697386}.status.running{color:var(--accent);border-color:#526637}.status.running .dot{background:var(--accent)}.layout{display:grid;grid-template-columns:1.5fr .8fr;gap:16px}.card{border:1px solid var(--line);border-radius:22px;background:#191e2aee;box-shadow:0 18px 60px #0002}.timer{padding:clamp(22px,5vw,42px);text-align:center}.eyebrow{margin:0 0 12px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.modes{display:inline-flex;gap:4px;padding:4px;margin-bottom:20px;border:1px solid var(--line);border-radius:12px;background:#10141d}.modes button{padding:8px 14px;border:0;border-radius:8px;background:transparent;color:var(--muted)}.modes button[aria-pressed=true]{background:#202636;color:var(--text)}.clock{margin:5px 0;font-size:clamp(58px,12vw,100px);font-weight:750;line-height:1;letter-spacing:-.06em;white-space:nowrap}.fraction{color:var(--accent)}.label{min-height:20px;color:var(--muted);font-size:13px}.settings{display:none;align-items:center;justify-content:center;gap:8px;margin:18px 0 0;color:var(--muted);font-size:13px}.settings.visible{display:flex}.settings input{width:76px;padding:8px;border:1px solid var(--line);border-radius:9px;color:var(--text);background:#10141d;text-align:center}.controls{display:flex;justify-content:center;gap:10px;margin-top:28px}.btn{min-height:48px;padding:0 18px;border:1px solid var(--line);border-radius:12px;color:var(--text);background:#202636;font-weight:700}.btn.primary{min-width:150px;border-color:var(--accent);color:#171d0c;background:var(--accent)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn:focus-visible,.modes button:focus-visible,.clear:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.hint{margin:17px 0 0;color:#788398;font-size:12px}kbd{padding:2px 6px;border:1px solid #414a5d;border-radius:5px;color:#bac4d4;background:#202636;font-size:11px}.laps{padding:20px;min-height:360px}.laps-head{display:flex;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}.laps-head h2{margin:0;font-size:15px}.count{color:var(--muted);font-size:12px}.list{max-height:300px;overflow:auto}.empty{display:grid;min-height:230px;place-items:center;color:#788398;text-align:center;font-size:13px}.lap{display:flex;justify-content:space-between;gap:8px;padding:13px 2px;border-bottom:1px solid #282f3e;font-variant-numeric:tabular-nums}.lap small{color:var(--muted)}.lap strong{font-size:15px}.lap.best strong{color:var(--accent)}footer{display:flex;justify-content:space-between;margin-top:18px;color:#788398;font-size:12px}.clear{padding:0;border:0;color:var(--muted);background:none;text-decoration:underline}@media(max-width:680px){.shell{padding-top:18px}.layout{grid-template-columns:1fr;gap:12px}.timer{padding:24px 12px}.clock{font-size:clamp(55px,15vw,82px)}.laps{min-height:220px}.list{max-height:230px}.empty{min-height:110px}}@media(max-width:380px){.controls{gap:6px}.btn{padding:0 12px}.btn.primary{min-width:128px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="header"><div class="brand"><div class="icon" aria-hidden="true">🤖</div><div><h1 class="title">Robot Timer</h1><p class="subtitle">เครื่องจับเวลาสำหรับภารกิจหุ่นยนต์</p></div></div><div class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">พร้อมเริ่ม</span></div></header>
    <div class="layout">
      <section class="card timer"><p class="eyebrow">Mission clock</p><div class="modes" role="group" aria-label="เลือกรูปแบบการจับเวลา"><button type="button" data-mode="up" aria-pressed="true">จับขึ้น</button><button type="button" data-mode="down" aria-pressed="false">นับถอยหลัง</button></div>
        <div class="clock" id="clock" role="timer"><span id="main">00:00</span><span class="fraction">.<span id="fraction">00</span></span></div><div class="label" id="label">นาที : วินาที : เศษวินาที</div>
        <div class="settings" id="settings"><label for="minutes">เวลาภารกิจ</label><input id="minutes" type="number" min="1" max="999" value="3"><label for="minutes">นาที</label></div>
        <div class="controls"><button class="btn primary" id="start" type="button">▶ เริ่มจับเวลา</button><button class="btn" id="lap" type="button" disabled>รอบ LAP</button><button class="btn" id="reset" type="button">รีเซ็ตเวลา</button></div><p class="hint"><kbd>Space</kbd> เริ่ม/พัก &nbsp; <kbd>L</kbd> บันทึกรอบ &nbsp; <kbd>R</kbd> รีเซ็ต</p>
      </section>
      <section class="card laps" aria-labelledby="lapsTitle"><div class="laps-head"><h2 id="lapsTitle">เวลารอบ</h2><span class="count" id="count">0 รอบ</span></div><div class="list" id="list"><div class="empty">ยังไม่มีเวลารอบ<br>กด “รอบ LAP” ระหว่างจับเวลา</div></div></section>
    </div>
    <footer><span>ความละเอียด 1/100 วินาที</span><button class="clear" id="clear" type="button">ล้างรอบ</button></footer>
  </main>
  <script>
    (()=>{
      const $=id=>document.getElementById(id), main=$('main'), fraction=$('fraction'), status=$('status'), statusText=$('statusText'), startBtn=$('start'), lapBtn=$('lap'), resetBtn=$('reset'), minutes=$('minutes'), modeButtons=[...document.querySelectorAll('[data-mode]')];
      let mode='up',running=false,finished=false,startAt=0,elapsed=0,intervalId=null,lastLapAt=0,laps=[];
      const target=()=>Math.max(1,Math.min(999,Number(minutes.value)||3))*60000;
      const elapsedNow=()=>elapsed+(running?performance.now()-startAt:0);
      function fmt(ms){const n=Math.floor(Math.max(0,ms)/10),seconds=Math.floor(n/100);return{main:String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0'),fraction:String(n%100).padStart(2,'0')}}
      function render(){const shown=mode==='down'?Math.max(0,target()-elapsedNow()):elapsedNow(),time=fmt(shown);main.textContent=time.main;fraction.textContent=time.fraction;if(mode==='down'&&running&&shown<=0)finish()}
      function setStatus(text,active=false){statusText.textContent=text;status.classList.toggle('running',active)}
      function start(){if(running){elapsed=elapsedNow();running=false;clearInterval(intervalId);startBtn.textContent='▶ ทำต่อ';setStatus('หยุดชั่วคราว');render();return}if(finished){elapsed=0;finished=false}running=true;startAt=performance.now();intervalId=setInterval(render,10);startBtn.textContent='Ⅱ พักเวลา';lapBtn.disabled=false;minutes.disabled=true;modeButtons.forEach(b=>b.disabled=true);setStatus('กำลังจับเวลา',true);render()}
      function finish(){running=false;finished=true;elapsed=target();clearInterval(intervalId);startBtn.textContent='▶ เริ่มใหม่';lapBtn.disabled=true;setStatus('หมดเวลา');render();beep()}
      function reset(){running=false;finished=false;elapsed=0;lastLapAt=0;laps=[];clearInterval(intervalId);startBtn.textContent='▶ เริ่มจับเวลา';lapBtn.disabled=true;minutes.disabled=false;modeButtons.forEach(b=>b.disabled=false);setStatus('พร้อมเริ่ม');renderLaps();render()}
      function addLap(){if(!running)return;const t=elapsedNow();laps.unshift({total:t,split:t-lastLapAt});lastLapAt=t;renderLaps()}
      function renderLaps(){$('count').textContent=`${laps.length} รอบ`;if(!laps.length){$('list').innerHTML='<div class="empty">ยังไม่มีเวลารอบ<br>กด “รอบ LAP” ระหว่างจับเวลา</div>';return}const best=Math.min(...laps.map(x=>x.split));$('list').innerHTML=laps.map((x,i)=>{const a=fmt(x.total),b=fmt(x.split);return `<div class="lap ${x.split===best?'best':''}"><small>รอบ ${String(laps.length-i).padStart(2,'0')} · รวม ${a.main}.${a.fraction}${x.split===best?' · เร็วสุด':''}</small><strong>+${b.main}.${b.fraction}</strong></div>`}).join('')}
      function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.18,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.7);o.start();o.stop(a.currentTime+.7);o.onended=()=>a.close()}catch(_){}}
      modeButtons.forEach(b=>b.addEventListener('click',()=>{if(running)return;mode=b.dataset.mode;modeButtons.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('settings').classList.toggle('visible',mode==='down');$('label').textContent=mode==='down'?'เวลาที่เหลือ · นาที : วินาที : เศษวินาที':'นาที : วินาที : เศษวินาที';elapsed=0;finished=false;startBtn.textContent='▶ เริ่มจับเวลา';setStatus('พร้อมเริ่ม');render()}));
      startBtn.addEventListener('click',start);lapBtn.addEventListener('click',addLap);resetBtn.addEventListener('click',event=>{event.preventDefault();reset()});$('clear').addEventListener('click',()=>{laps=[];lastLapAt=elapsedNow();renderLaps()});minutes.addEventListener('change',render);
      window.addEventListener('keydown',event=>{if(event.ctrlKey||event.metaKey||event.altKey||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(event.code==='Space'){event.preventDefault();start()}if(event.key.toLowerCase()==='l')addLap();if(event.key.toLowerCase()==='r'){event.preventDefault();reset()}});
      render();
    })();
  </script>
</body>
</html>
